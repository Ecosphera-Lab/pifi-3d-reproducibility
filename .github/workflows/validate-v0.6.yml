name: Validate PIFI-3D v0.6

on:
  push:
    branches:
      - release/pifi-3d-family-v0.6
    paths:
      - 'paper/**'
      - 'tools/**'
      - 'results/**'
      - 'docs/**'
      - 'run_all.py'
      - 'README.md'
      - 'REPRODUCE.md'
      - 'CLAIM_BOUNDARY.md'
      - 'PUBLIC_RELEASE_MANIFEST_v0_6.json'
      - '.github/workflows/validate-v0.6.yml'
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run frozen verifier chain
        run: python run_all.py

      - name: Compile manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload reproduction outputs
        uses: actions/upload-artifact@v4
        with:
          name: pifi-3d-v0.6-reproduced-results
          path: reproduced/

      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: pifi-3d-family-v0.6-pdf
          path: paper/main.pdf
